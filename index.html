<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI-901 備考站</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231d3a52%22/%3E%3Cpath d=%22M9 17l5 5 9-11%22 stroke=%22white%22 stroke-width=%223.5%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <div class="label">Sophavia · 目標原型</div>
          <h1><span class="code">AI-901</span> 備考站</h1>
          <p id="goal-line"></p>
        </div>
        <div class="data-ctl">
          <div class="sync"><i></i><span id="backup-note">資料存在這台裝置的瀏覽器</span></div>
          <div class="acts">
            <button type="button" class="btn ghost" id="btn-export">匯出備份</button>
            <button type="button" class="btn ghost" id="btn-import">匯入備份</button>
            <input type="file" id="import-file" accept=".json,application/json" hidden />
          </div>
        </div>
      </header>
      <div id="data-msg" role="status" aria-live="polite" hidden></div>
      <section id="summary" class="strip" aria-label="進度摘要"></section>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <main id="view"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
